{% extends "main.html" %}

{% block content %}
  <article class="ds-feature-article ds-feature-article--report">
    <div class="ds-feature-article__meta" aria-label="Report series">
      <span>Reports</span>
      <span aria-hidden="true">/</span>
      <span>{{ page.meta.report_subject }}</span>
      {% if page.meta.report_period %}
        <span class="ds-feature-article__period">{{ page.meta.report_period }}</span>
      {% endif %}
    </div>
    {{ page.content }}
  </article>
{% endblock %}
