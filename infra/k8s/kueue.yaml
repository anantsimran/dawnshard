# Kueue quota for the gang-admission demo: one GPU flavor, a cluster queue with
# quota for exactly one two-GPU job, and the team's local queue that JobSpec.queue
# names. kubectl apply -f infra/k8s/kueue.yaml after installing Kueue.
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: l4
spec:
  nodeLabels:
    cloud.google.com/gke-accelerator: nvidia-l4
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: gpu
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: l4
          resources:
            - name: cpu
              nominalQuota: 8
            - name: memory
              nominalQuota: 32Gi
            - name: nvidia.com/gpu
              nominalQuota: 2
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: team-a
  namespace: default
spec:
  clusterQueue: gpu
