site_name: Dawnshard
site_description: A top-down–designed ML infrastructure library with theory and revision notes for its core ideas.
site_url: https://anantsimran.github.io/dawnshard/
repo_url: https://github.com/anantsimran/dawnshard
repo_name: anantsimran/dawnshard

# MkDocs needs a single docs_dir, but the site mirrors repo paths so relative links
# behave the same here as on github.com. pages/hooks.py re-roots tutorials/ under
# tutorials/ and adds the READMEs listed in its EXTRA_PAGES.
docs_dir: tutorials
hooks:
  - pages/hooks.py
watch:
  - README.md
  - app/src/training/common/README.md
  - app/src/training/dataload/README.md
  - app/src/training/transformer/README.md
  - experiments
  - knowledge_sharing
  - pages
  - reports

theme:
  name: material
  custom_dir: pages/overrides
  icon:
    logo: material/weather-sunset-up
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Follow system theme
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - md_in_html
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn

nav:
  - Home: README.md
  - Revision guide: tutorials/index.md
  # One page per topic. A new tutorial is a ## section inside one of these files,
  # so it needs no nav entry; only a new topic file does.
  - Topics:
      - PyTorch: tutorials/pytorch.md
      - Training: tutorials/training.md
      - Transformers: tutorials/transformer.md
      - Math: tutorials/math.md
      - Vision: tutorials/vision.md
  - Knowledge sharing:
      - Reproducibility: knowledge_sharing/reproducibility.md
  - Code notes:
      - BPE tokenizer: app/src/training/common/README.md
      - DataLoader internals: app/src/training/dataload/README.md
      - Attention implementation: app/src/training/transformer/README.md
  - Reports:
      - Multi30k ablation studies: reports/multi30k_ablations.md
      - Multi30k tokenisation: reports/multi30k_tokenisation.md
  - Experiments:
      - Multi30k masked-token pretraining: experiments/multi30ken_predictor/2026-09-29/README.md
      - Multi30k masked-token dropout and decay: experiments/multi30ken_predictor/2026-10-15/README.md
      - Multi30k translation ablation: experiments/multi30k_translator/2026-10-13/README.md
      - Multi30k translation scale study: experiments/multi30k_translator/2026-10-15/README.md
