name: Pages

# Builds README.md, tutorials/, and package READMEs into the site at
# https://anantsimran.github.io/dawnshard/ (config: mkdocs.yml, pages/).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned: MkDocs 2.0 removes the plugin and theme-override system that
      # pages/hooks.py and pages/overrides/ rely on.
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7 pymdown-extensions==12.0
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
