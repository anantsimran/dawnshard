[project]
name = "dawnshard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "wandb",
    "psutil",
    "numpy>=2.0",
    "jaxtyping",
    "beartype",
    "loguru",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest", "pyright", "ruff", "mdformat", "torchvision", "nbconvert", "jupytext", "ipykernel", "torchviz", "torchinfo"]

[tool.pyright]
include = ["app/src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
external = ["NAR001"]

[tool.pytest.ini_options]
pythonpath = ["app/src"]
testpaths = ["app/tests"]
